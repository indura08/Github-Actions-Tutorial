name: Workflows jobs steps

#methna on kiynne event ek puh da PR da nattnm nikna workflow_dispatch ekkd kiyna eka
on:
    workflow_dispatch:

jobs:
    job-1:
        runs-on: ubuntu-24.04
        steps:
            - run: echo "A job consist of one more steps"
            - run: echo "Which runs sequentially within the same compute environment"
    
    job-2:
        runs-on: ubuntu-24.04
        steps:
            - run: echo "multiple jobs can run in parallel"

    job-3:
        runs-on: ubuntu-24.04
        #need keyword ek use wenne me job 3 run wenna nm job 1 and job 2 dekama run wela thiyenna one , eki wenne 
        # mehma dammama directed acyclic graph (DAG) ekk hadenwa worflow ek run wenwakota hariyt caprome eke thiyenwa wage 
        needs: 
            - job-1
            - job-2

        steps:
            - run: echo "they can also depend on one another..."
        
    job-4: 
        runs-on: ubuntu-24.04
        needs: 
            - job-2
            - job-3
        steps:
            - run: echo "..to form a firected cyclic graph (DAG)"

name: step types

on:
    workflow_dispatch:

jobs:
    say-hello-inline-bash:
        runs-on: ubuntu-24.04
        steps:
            - run: echo "hello world"

    say-hello-inline-python:
        runs-on: ubuntu-24.04
        steps:
            - run: print("hello world")
              shell: python

    say-hello-action:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/hello-world-javascript-action
              with:
                who-to-greet: "world"